<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supino reto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body {
      background-color: #0B0D10;
      color: #EDEFF2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0B0D10] text-[#EDEFF2] flex justify-center selection:bg-[#B26BFF]/30">
  <div class="w-full max-w-md min-h-screen flex flex-col p-4 pb-8 box-border">

    <!-- Header / Top Bar -->
    <header class="flex items-center justify-between h-12 mb-2">
      <button type="button" aria-label="Voltar" class="w-12 h-12 -ml-2 flex items-center justify-center text-[#EDEFF2] active:opacity-70 transition-opacity">
        <span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
      </button>
      <h1 class="text-[20px] font-semibold tracking-tight text-[#EDEFF2] text-center flex-1 pr-10">
        Supino reto
      </h1>
    </header>

    <main class="flex flex-col gap-3">
      <!-- Headline Card (Melhor série) -->
      <section class="bg-[#14171C] rounded-[12px] border border-white/[0.08] p-4 flex flex-col">
        <span class="text-[13px] text-[#8A919B] font-normal leading-tight">
          Melhor série
        </span>
        <div class="text-[32px] font-semibold text-[#EDEFF2] tabular-nums tracking-tight mt-1 leading-none">
          100 kg × 8
        </div>
        <span class="text-[13px] text-[#8A919B] font-normal mt-2 leading-tight">
          1RM estimado 126 kg
        </span>
      </section>

      <!-- Segmented Toggle -->
      <div class="bg-[#14171C] border border-white/[0.08] rounded-[12px] p-1 flex items-center">
        <button type="button" class="flex-1 py-2 rounded-[8px] bg-[#1D222A] text-[#EDEFF2] text-[14px] font-medium text-center min-h-[40px] flex items-center justify-center">
          12 semanas
        </button>
        <button type="button" class="flex-1 py-2 rounded-[8px] text-[#8A919B] text-[14px] font-medium text-center min-h-[40px] flex items-center justify-center hover:text-[#EDEFF2] transition-colors">
          Tudo
        </button>
      </div>

      <!-- Main Progress Line Chart Card -->
      <section class="bg-[#14171C] rounded-[12px] border border-white/[0.08] p-4 flex flex-col">
        <div class="h-[160px] w-full flex flex-col justify-between">
          <!-- SVG Line Chart (160px container, lines, dots) -->
          <div class="w-full flex-1">
            <svg class="w-full h-full overflow-visible" viewBox="0 0 340 120" preserveAspectRatio="none" fill="none">
              <!-- Single magenta #F72585 2.5px line, no fill -->
              <polyline
                points="16,92 110,64 210,42 324,18"
                stroke="#F72585"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <!-- Four small magenta dots -->
              <circle cx="16" cy="92" r="3.5" fill="#F72585" />
              <circle cx="110" cy="64" r="3.5" fill="#F72585" />
              <circle cx="210" cy="42" r="3.5" fill="#F72585" />
              <circle cx="324" cy="18" r="3.5" fill="#F72585" />
            </svg>
          </div>
          <!-- Three muted axis labels only -->
          <div class="flex justify-between items-center text-[13px] text-[#8A919B] tabular-nums pt-2 border-t border-transparent">
            <span>Set</span>
            <span>Out</span>
            <span>Nov</span>
          </div>
        </div>
      </section>

      <!-- Smaller Volume Chart Card -->
      <section class="bg-[#14171C] rounded-[12px] border border-white/[0.08] p-4 flex flex-col">
        <span class="text-[13px] text-[#8A919B] font-normal leading-tight mb-2">
          Volume por semana
        </span>
        <div class="h-[100px] w-full flex flex-col justify-between">
          <div class="w-full flex-1">
            <svg class="w-full h-full overflow-visible" viewBox="0 0 340 68" preserveAspectRatio="none" fill="none">
              <!-- Magenta line -->
              <polyline
                points="16,54 110,38 210,44 324,14"
                stroke="#F72585"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <!-- Four small magenta dots -->
              <circle cx="16" cy="54" r="3" fill="#F72585" />
              <circle cx="110" cy="38" r="3" fill="#F72585" />
              <circle cx="210" cy="44" r="3" fill="#F72585" />
              <circle cx="324" cy="14" r="3" fill="#F72585" />
            </svg>
          </div>
          <!-- Three muted axis labels only -->
          <div class="flex justify-between items-center text-[13px] text-[#8A919B] tabular-nums pt-1">
            <span>Sem 1</span>
            <span>Sem 6</span>
            <span>Sem 12</span>
          </div>
        </div>
      </section>

      <!-- Compact List of the last three Sets -->
      <section class="bg-[#14171C] rounded-[12px] border border-white/[0.08] overflow-hidden">
        <!-- Set 1 (Recent / Live Set with 3px left violet bar) -->
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-white/[0.06] relative min-h-[48px]">
          <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-[#B26BFF]"></div>
          <span class="text-[13px] text-[#8A919B] tabular-nums pl-1">
            14 nov
          </span>
          <span class="text-[15px] font-semibold text-[#EDEFF2] tabular-nums text-right">
            100 kg × 8
          </span>
        </div>

        <!-- Set 2 -->
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-white/[0.06] min-h-[48px]">
          <span class="text-[13px] text-[#8A919B] tabular-nums">
            10 nov
          </span>
          <span class="text-[15px] font-semibold text-[#EDEFF2] tabular-nums text-right">
            96 kg × 8
          </span>
        </div>

        <!-- Set 3 -->
        <div class="flex items-center justify-between px-4 py-3.5 min-h-[48px]">
          <span class="text-[13px] text-[#8A919B] tabular-nums">
            06 nov
          </span>
          <span class="text-[15px] font-semibold text-[#EDEFF2] tabular-nums text-right">
            92 kg × 10
          </span>
        </div>
      </section>

      <!-- Primary Action Button with Violet #B26BFF -->
      <div class="pt-2">
        <button type="button" class="w-full h-12 bg-[#B26BFF] hover:bg-[#a65bf3] text-black font-semibold text-[15px] rounded-[12px] flex items-center justify-center transition-colors active:opacity-90">
          Registrar nova série
        </button>
      </div>
    </main>
  </div>
</body>
</html>
