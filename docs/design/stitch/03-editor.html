<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0B0D10;
      color: #EDEFF2;
      font-feature-settings: "tnum" on, "cv01" on;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#0B0D10] text-[#EDEFF2] min-h-screen flex flex-col justify-between p-4 selection:bg-[#B26BFF]/30">

  <!-- Top bar & Content Wrapper -->
  <div class="w-full flex flex-col gap-4">
    <!-- Header: Navigation and Screen Title -->
    <header class="flex items-center justify-between h-12 w-full pt-1">
      <button type="button" class="text-[#8A919B] text-[15px] font-medium min-w-[48px] min-h-[48px] flex items-center justify-start focus:outline-none" aria-label="Cancelar edição">
        Cancelar
      </button>
      
      <h1 class="text-[20px] font-semibold tracking-tight text-[#EDEFF2] text-center">
        Rotina
      </h1>
      
      <button type="button" class="text-[#8A919B] text-[15px] font-medium min-w-[48px] min-h-[48px] flex items-center justify-end focus:outline-none" aria-label="Salvar alterações">
        Salvar
      </button>
    </header>

    <!-- Routine Name Field -->
    <section class="w-full">
      <label for="routine-name" class="sr-only">Nome da rotina</label>
      <div class="w-full bg-[#14171C] border border-white/[0.08] rounded-[12px] px-4 py-3 flex items-center">
        <input 
          id="routine-name" 
          type="text" 
          value="Rotina A — Peito e tríceps" 
          class="w-full bg-transparent text-[#EDEFF2] text-[16px] font-medium focus:outline-none placeholder-[#8A919B]" 
          aria-label="Nome da rotina"
        />
      </div>
    </section>

    <!-- Exercise List -->
    <section class="flex flex-col gap-3 w-full" aria-label="Exercícios da rotina">
      
      <!-- Row 1: Supino reto -->
      <article class="bg-[#14171C] border border-white/[0.08] rounded-[12px] p-3 flex items-center justify-between gap-3">
        <!-- Drag handle + Info -->
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <!-- Drag handle glyph -->
          <div class="text-[#8A919B] cursor-grab min-w-[28px] min-h-[48px] flex items-center justify-center flex-shrink-0" aria-label="Reordenar exercício">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="6" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="6" r="1.5" fill="currentColor"/>
              <circle cx="9" cy="12" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="12" r="1.5" fill="currentColor"/>
              <circle cx="9" cy="18" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="18" r="1.5" fill="currentColor"/>
            </svg>
          </div>
          <!-- Exercise details -->
          <div class="min-w-0 flex-1">
            <h2 class="text-[17px] font-semibold text-[#EDEFF2] truncate leading-snug">Supino reto</h2>
            <p class="text-[13px] text-[#8A919B] font-normal tabular-nums leading-normal mt-0.5">3 séries · 8 reps · 100 kg</p>
          </div>
        </div>

        <!-- Controls: Steppers & Delete -->
        <div class="flex items-center gap-1 flex-shrink-0">
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] rounded-lg bg-white/[0.04] text-[#EDEFF2] flex items-center justify-center text-[18px] font-semibold focus:outline-none active:bg-white/[0.08]" aria-label="Diminuir séries">
            −
          </button>
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] rounded-lg bg-white/[0.04] text-[#EDEFF2] flex items-center justify-center text-[18px] font-semibold focus:outline-none active:bg-white/[0.08]" aria-label="Aumentar séries">
            +
          </button>
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] flex items-center justify-center text-[#8A919B] hover:text-[#EDEFF2] focus:outline-none ml-0.5" aria-label="Remover exercício">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </article>

      <!-- Row 2: Desenvolvimento militar -->
      <article class="bg-[#14171C] border border-white/[0.08] rounded-[12px] p-3 flex items-center justify-between gap-3">
        <!-- Drag handle + Info -->
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <div class="text-[#8A919B] cursor-grab min-w-[28px] min-h-[48px] flex items-center justify-center flex-shrink-0" aria-label="Reordenar exercício">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="6" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="6" r="1.5" fill="currentColor"/>
              <circle cx="9" cy="12" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="12" r="1.5" fill="currentColor"/>
              <circle cx="9" cy="18" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="18" r="1.5" fill="currentColor"/>
            </svg>
          </div>
          <div class="min-w-0 flex-1">
            <h2 class="text-[17px] font-semibold text-[#EDEFF2] truncate leading-snug">Desenvolvimento militar</h2>
            <p class="text-[13px] text-[#8A919B] font-normal tabular-nums leading-normal mt-0.5">3 séries · 10 reps · 50 kg</p>
          </div>
        </div>

        <!-- Controls: Steppers & Delete -->
        <div class="flex items-center gap-1 flex-shrink-0">
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] rounded-lg bg-white/[0.04] text-[#EDEFF2] flex items-center justify-center text-[18px] font-semibold focus:outline-none active:bg-white/[0.08]" aria-label="Diminuir séries">
            −
          </button>
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] rounded-lg bg-white/[0.04] text-[#EDEFF2] flex items-center justify-center text-[18px] font-semibold focus:outline-none active:bg-white/[0.08]" aria-label="Aumentar séries">
            +
          </button>
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] flex items-center justify-center text-[#8A919B] hover:text-[#EDEFF2] focus:outline-none ml-0.5" aria-label="Remover exercício">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </article>

      <!-- Row 3: Tríceps testa -->
      <article class="bg-[#14171C] border border-white/[0.08] rounded-[12px] p-3 flex items-center justify-between gap-3">
        <!-- Drag handle + Info -->
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <div class="text-[#8A919B] cursor-grab min-w-[28px] min-h-[48px] flex items-center justify-center flex-shrink-0" aria-label="Reordenar exercício">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="6" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="6" r="1.5" fill="currentColor"/>
              <circle cx="9" cy="12" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="12" r="1.5" fill="currentColor"/>
              <circle cx="9" cy="18" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="18" r="1.5" fill="currentColor"/>
            </svg>
          </div>
          <div class="min-w-0 flex-1">
            <h2 class="text-[17px] font-semibold text-[#EDEFF2] truncate leading-snug">Tríceps testa</h2>
            <p class="text-[13px] text-[#8A919B] font-normal tabular-nums leading-normal mt-0.5">3 séries · 10 reps · 36 kg</p>
          </div>
        </div>

        <!-- Controls: Steppers & Delete -->
        <div class="flex items-center gap-1 flex-shrink-0">
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] rounded-lg bg-white/[0.04] text-[#EDEFF2] flex items-center justify-center text-[18px] font-semibold focus:outline-none active:bg-white/[0.08]" aria-label="Diminuir séries">
            −
          </button>
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] rounded-lg bg-white/[0.04] text-[#EDEFF2] flex items-center justify-center text-[18px] font-semibold focus:outline-none active:bg-white/[0.08]" aria-label="Aumentar séries">
            +
          </button>
          <button type="button" class="w-10 h-10 min-w-[40px] min-h-[40px] flex items-center justify-center text-[#8A919B] hover:text-[#EDEFF2] focus:outline-none ml-0.5" aria-label="Remover exercício">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </article>

      <!-- Add Exercise Row -->
      <button 
        type="button" 
        class="w-full min-h-[48px] bg-[#14171C] border border-dashed border-white/[0.08] hover:border-[#8A919B]/40 rounded-[12px] p-3.5 flex items-center justify-center gap-2 text-[#8A919B] hover:text-[#EDEFF2] transition-colors focus:outline-none"
        aria-label="Adicionar exercício"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="text-[14px] font-medium leading-none">Adicionar exercício</span>
      </button>

    </section>
  </div>

  <!-- Bottom CTA -->
  <footer class="w-full pt-6 pb-2">
    <button 
      type="button" 
      class="w-full h-14 min-h-[56px] bg-[#B26BFF] hover:bg-[#a052ff] active:opacity-90 text-[#0B0D10] font-semibold text-[16px] rounded-[12px] flex items-center justify-center transition-all focus:outline-none"
      aria-label="Salvar rotina"
    >
      Salvar rotina
    </button>
  </footer>

</body>
</html>
