<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessão em Andamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0B0D10;
      color: #EDEFF2;
      margin: 0;
      padding: 0;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[#0B0D10] text-[#EDEFF2] min-h-screen flex justify-center">
  <main class="w-full max-w-[390px] min-h-screen flex flex-col justify-between p-4 bg-[#0B0D10]">
    
    <!-- Top Header & Exercises Content -->
    <div class="flex flex-col gap-5">
      
      <!-- Header Area -->
      <header class="pt-3 pb-1">
        <h1 class="text-[20px] font-semibold leading-tight text-[#EDEFF2] tracking-tight">
          Rotina A — Peito e tríceps
        </h1>
        <p class="text-[13px] font-normal text-[#8A919B] mt-1 tnum">
          42:15
        </p>
      </header>

      <!-- Exercise 1: Supino reto -->
      <section class="bg-[#14171C] border border-[rgba(255,255,255,0.08)] rounded-[12px] p-4 flex flex-col gap-3">
        <!-- Exercise Header -->
        <div class="flex flex-col">
          <h2 class="text-[17px] font-semibold leading-snug text-[#EDEFF2]">
            Supino reto
          </h2>
          <p class="text-[13px] font-normal text-[#8A919B] mt-0.5 tnum">
            3 séries · 8 reps · 100 kg
          </p>
        </div>

        <!-- Set Rows -->
        <div class="flex flex-col gap-2 mt-1">
          <!-- Set 1: LIVE SET (Active) -->
          <div class="relative bg-[#1D222A] rounded-[8px] overflow-hidden pl-4 pr-3 py-2 flex items-center justify-between min-h-[58px]">
            <!-- 3px Violet Bar on the left -->
            <div class="absolute left-0 top-0 bottom-0 w-[3px] bg-[#B26BFF]"></div>
            
            <div class="flex items-center gap-2 tnum">
              <span class="text-[13px] font-medium text-[#8A919B] w-4">1</span>
              <div class="flex items-baseline gap-1">
                <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">100</span>
                <span class="text-[13px] font-normal text-[#8A919B]">kg</span>
              </div>
              <span class="text-[17px] text-[#8A919B] px-1 font-light leading-none">×</span>
              <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">8</span>
            </div>

            <!-- Live button: 48x48 rounded, violet filled with dark check -->
            <button type="button" aria-label="Concluir série 1" class="w-12 h-12 rounded-[10px] bg-[#B26BFF] flex items-center justify-center shrink-0">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0D10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>

          <!-- Set 2: Pending/Later -->
          <div class="bg-[#14171C] rounded-[8px] pl-4 pr-3 py-2 flex items-center justify-between min-h-[58px]">
            <div class="flex items-center gap-2 tnum">
              <span class="text-[13px] font-medium text-[#8A919B] w-4">2</span>
              <div class="flex items-baseline gap-1">
                <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">100</span>
                <span class="text-[13px] font-normal text-[#8A919B]">kg</span>
              </div>
              <span class="text-[17px] text-[#8A919B] px-1 font-light leading-none">×</span>
              <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">8</span>
            </div>

            <!-- Outline Button -->
            <button type="button" aria-label="Série 2 pendente" class="w-12 h-12 rounded-[10px] border border-[rgba(255,255,255,0.15)] flex items-center justify-center shrink-0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>

          <!-- Set 3: Pending/Later -->
          <div class="bg-[#14171C] rounded-[8px] pl-4 pr-3 py-2 flex items-center justify-between min-h-[58px]">
            <div class="flex items-center gap-2 tnum">
              <span class="text-[13px] font-medium text-[#8A919B] w-4">3</span>
              <div class="flex items-baseline gap-1">
                <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">100</span>
                <span class="text-[13px] font-normal text-[#8A919B]">kg</span>
              </div>
              <span class="text-[17px] text-[#8A919B] px-1 font-light leading-none">×</span>
              <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">8</span>
            </div>

            <!-- Outline Button -->
            <button type="button" aria-label="Série 3 pendente" class="w-12 h-12 rounded-[10px] border border-[rgba(255,255,255,0.15)] flex items-center justify-center shrink-0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Exercise 2: Tríceps testa -->
      <section class="bg-[#14171C] border border-[rgba(255,255,255,0.08)] rounded-[12px] p-4 flex flex-col gap-3">
        <!-- Exercise Header -->
        <div class="flex flex-col">
          <h2 class="text-[17px] font-semibold leading-snug text-[#EDEFF2]">
            Tríceps testa
          </h2>
          <p class="text-[13px] font-normal text-[#8A919B] mt-0.5 tnum">
            3 séries · 8 reps · 100 kg
          </p>
        </div>

        <!-- Set Rows -->
        <div class="flex flex-col gap-2 mt-1">
          <!-- Set 1: Pending/Later -->
          <div class="bg-[#14171C] rounded-[8px] pl-4 pr-3 py-2 flex items-center justify-between min-h-[58px]">
            <div class="flex items-center gap-2 tnum">
              <span class="text-[13px] font-medium text-[#8A919B] w-4">1</span>
              <div class="flex items-baseline gap-1">
                <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">36</span>
                <span class="text-[13px] font-normal text-[#8A919B]">kg</span>
              </div>
              <span class="text-[17px] text-[#8A919B] px-1 font-light leading-none">×</span>
              <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">10</span>
            </div>

            <button type="button" aria-label="Série 1 pendente" class="w-12 h-12 rounded-[10px] border border-[rgba(255,255,255,0.15)] flex items-center justify-center shrink-0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>

          <!-- Set 2: Pending/Later -->
          <div class="bg-[#14171C] rounded-[8px] pl-4 pr-3 py-2 flex items-center justify-between min-h-[58px]">
            <div class="flex items-center gap-2 tnum">
              <span class="text-[13px] font-medium text-[#8A919B] w-4">2</span>
              <div class="flex items-baseline gap-1">
                <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">36</span>
                <span class="text-[13px] font-normal text-[#8A919B]">kg</span>
              </div>
              <span class="text-[17px] text-[#8A919B] px-1 font-light leading-none">×</span>
              <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">10</span>
            </div>

            <button type="button" aria-label="Série 2 pendente" class="w-12 h-12 rounded-[10px] border border-[rgba(255,255,255,0.15)] flex items-center justify-center shrink-0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>

          <!-- Set 3: Pending/Later -->
          <div class="bg-[#14171C] rounded-[8px] pl-4 pr-3 py-2 flex items-center justify-between min-h-[58px]">
            <div class="flex items-center gap-2 tnum">
              <span class="text-[13px] font-medium text-[#8A919B] w-4">3</span>
              <div class="flex items-baseline gap-1">
                <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">36</span>
                <span class="text-[13px] font-normal text-[#8A919B]">kg</span>
              </div>
              <span class="text-[17px] text-[#8A919B] px-1 font-light leading-none">×</span>
              <span class="text-[32px] font-semibold text-[#EDEFF2] leading-none">10</span>
            </div>

            <button type="button" aria-label="Série 3 pendente" class="w-12 h-12 rounded-[10px] border border-[rgba(255,255,255,0.15)] flex items-center justify-center shrink-0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </section>

    </div>

    <!-- Pinned Footer -->
    <footer class="pt-6 pb-2 flex flex-col items-center gap-3 w-full">
      <button type="button" class="w-full h-[56px] rounded-[12px] bg-[#B26BFF] text-[#0B0D10] font-semibold text-[16px] flex items-center justify-center tracking-tight transition-opacity active:opacity-90">
        Finalizar
      </button>
      <button type="button" class="text-[14px] text-[#8A919B] hover:text-[#EDEFF2] transition-colors py-2 px-4">
        Descartar
      </button>
    </footer>

  </main>
</body>
</html>
